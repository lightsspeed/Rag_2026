services:
  frontend:
    image: lightsspeed/rag-chatbot-frontend:v1.0.0
    # build:
    #   context: .
    #   dockerfile: docker/frontend.Dockerfile
    container_name: knowledgeflow_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - frontend
    restart: always

  backend:
    image: lightsspeed/rag-chatbot-backend:v1.0.1
    # build:
    #   context: .
    #   dockerfile: docker/backend.Dockerfile
    container_name: knowledgeflow_backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ENVIRONMENT: production
    volumes:
      - app_uploads:/app/uploads
      - app_chroma:/app/chroma_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: knowledgeflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: always

  redis:
    image: redis:7-alpine
    container_name: knowledgeflow_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend
    restart: always

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  app_uploads:
  app_chroma:
