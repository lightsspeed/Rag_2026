apiVersion: v1
kind: ConfigMap
metadata:
  name: fastrag-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  fastrag-dashboard.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": "-- Grafana --",
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": "prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 10,
          "title": "Total Queries Today",
          "type": "stat",
          "targets": [
            { "expr": "sum(increase(rag_queries_total[24h]))", "refId": "A" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto" },
          "fieldConfig": { "defaults": { "decimals": 0 } }
        },
        {
          "datasource": "prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 11,
          "title": "Positive Feedback Rate",
          "type": "stat",
          "targets": [
            { "expr": "sum(increase(rag_user_feedback_total{rating=\"up\"}[24h])) / (sum(increase(rag_user_feedback_total[24h])) > 0) * 100", "refId": "A" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "unit": "percent" },
          "fieldConfig": { "defaults": { "decimals": 1 } }
        },
        {
          "datasource": "prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 12,
          "title": "Total Tokens Consumed",
          "type": "stat",
          "targets": [
            { "expr": "sum(increase(rag_tokens_input_total[24h])) + sum(increase(rag_tokens_output_total[24h]))", "refId": "A" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto" },
          "fieldConfig": { "defaults": { "decimals": 0 } }
        },
        {
          "datasource": "prometheus",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 13,
          "title": "Avg Retrieval Score",
          "type": "stat",
          "targets": [
            { "expr": "sum(increase(rag_retrieval_best_score_sum[1h])) / (sum(increase(rag_retrieval_best_score_count[1h])) > 0)", "refId": "A" }
          ],
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto" },
          "fieldConfig": { "defaults": { "decimals": 2, "max": 1, "min": 0 } }
        },
        {
          "datasource": "prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 14,
          "title": "Tokens by API Key Slot",
          "type": "graph",
          "targets": [
            { "expr": "sum(rate(rag_tokens_input_total[5m])) by (api_key_slot) + sum(rate(rag_tokens_output_total[5m])) by (api_key_slot)", "legendFormat": "Slot {{api_key_slot}}", "refId": "A" }
          ],
          "xaxis": { "mode": "time", "show": true },
          "yaxes": [{ "format": "short", "min": 0, "show": true }, { "format": "short", "show": true }]
        },
        {
          "datasource": "prometheus",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 15,
          "title": "Tokens by User",
          "type": "graph",
          "targets": [
            { "expr": "sum(rate(rag_tokens_per_user_total[5m])) by (user_id)", "legendFormat": "User {{user_id}}", "refId": "A" }
          ],
          "xaxis": { "mode": "time", "show": true },
          "yaxes": [{ "format": "short", "min": 0, "show": true }, { "format": "short", "show": true }]
        },
        {
          "datasource": "prometheus",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 12 },
          "id": 2,
          "title": "Request Rate (per second)",
          "type": "graph",
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_count{namespace=\"fastrag\"}[5m])) by (handler)",
              "legendFormat": "{{handler}}",
              "refId": "A"
            }
          ],
          "xaxis": { "mode": "time", "show": true },
          "yaxes": [{ "format": "short", "min": 0, "show": true }, { "format": "short", "show": true }]
        }
      ],
      "schemaVersion": 16,
      "style": "dark",
      "tags": ["fastapi", "fastrag", "knowledgeflow"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m", "15m", "30m", "1h", "2h", "1d"],
        "time_options": ["5m", "15m", "1h", "6h", "12h", "24h", "2d", "7d", "30d"]
      },
      "timezone": "",
      "title": "KnowledgeFlow AI Dashboard",
      "uid": "knowledgeflow-dashboard",
      "version": 2
    }
